[package]
name = "static-ui-wayland"
version = "0.1.0"
edition = "2024"
description = "static-ui on Wayland: CPU raster of damaged rectangles, glyph atlas, frames only when needed"

[dependencies]
static-ecs = { path = "../static-ecs" }
static-ui = { path = "../static-ui" }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# Pure-Rust protocol backend: no libwayland.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
rustix = { version = "1", features = ["fs", "mm", "time", "event", "pipe"] }
