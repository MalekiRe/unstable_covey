[package]
name = "flappy"
version = "0.1.0"
edition = "2024"
publish = false

# A CPU-rendered Wayland client on static-ecs and static-window.
# Launch latency: cargo run --release -p flappy --bin flappy-launch
[dependencies]
static-ecs = { path = "../../crates/static-ecs" }
static-window = { path = "../../crates/static-window" }
rustix = { version = "1", features = ["time"] }
