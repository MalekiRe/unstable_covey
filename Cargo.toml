[package]
name = "static-ecs"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["demo/*"]
resolver = "3"

[profile.release]
lto = "thin"
codegen-units = 1

# Concrete schedule types have enormous names; full debug info for them
# dominates debug builds. Keep file:line backtraces only.
[profile.dev]
debug = "line-tables-only"
